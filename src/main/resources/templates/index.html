<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#12581a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gehan Cloud">
    <title>Gehan.cloud</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

    <div class="bg"></div>
    <div class="bg bg2"></div>
    <div class="bg bg3"></div>

    <div class="screen">

        <header class="topbar">
            <div>
                <p class="greeting" id="greeting">Welcome back</p>
                <p class="clock" id="clock">&nbsp;</p>
                <p class="today" id="today">&nbsp;</p>
            </div>
            <div class="topbar-actions">
                <form method="post" th:action="@{/logout}">
                    <button class="chip" type="submit" title="Sign out">
                        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                        <span class="sr-only">Sign out</span>
                    </button>
                </form>
            </div>
        </header>

        <!-- Tiles come from apps.yml. Add a service there, not here.
             Without JS this stays one grid; indexjs.js turns it into swipeable
             pages with dots once it runs. -->
        <nav class="apps" id="apps" aria-label="Apps">
            <a class="app" th:each="app : ${apps}"
               th:with="unreachable=${app.lanOnly and !onLan}"
               th:classappend="${unreachable} ? 'app-off' : ''"
               th:href="${unreachable} ? null : ${app.url}"
               th:title="${unreachable} ? ${app.label} + ' — only reachable on the home network' : ${app.label}"
               th:attr="aria-disabled=${unreachable} ? 'true' : null"
               th:target="${app.external and !unreachable} ? '_blank' : null"
               th:rel="${app.external and !unreachable} ? 'noopener' : null">
                <span class="app-icon" th:classappend="'a-' + ${app.color}">
                    <i class="bi" th:classappend="${app.icon}" aria-hidden="true"></i>
                    <span class="app-lock" th:if="${unreachable}" aria-hidden="true">
                        <i class="bi bi-house-lock-fill"></i>
                    </span>
                </span>
                <span class="app-label" th:text="${app.label}">App</span>
            </a>
        </nav>

        <h2 class="section-label">Weather</h2>

        <section class="widgets" aria-label="Weather">

            <article class="wx flex-weather bg-ham">
                <p class="wx-place">Hamilton</p>
                <div class="wx-mid">
                    <span class="wx-temp" id="ham-temp">&mdash;</span>
                    <span id="ham-desc"></span>
                </div>
                <p class="wx-meta">
                    <span id="ham-rh">&mdash;</span>
                    <span class="sep" aria-hidden="true">&middot;</span>
                    <span id="ham-wind">&mdash;</span>
                </p>
            </article>

            <article class="wx flex-weather bg-nyc">
                <p class="wx-place">New York</p>
                <div class="wx-mid">
                    <span class="wx-temp" id="nyc-temp">&mdash;</span>
                    <span id="nyc-desc"></span>
                </div>
                <p class="wx-meta">
                    <span id="nyc-rh">&mdash;</span>
                    <span class="sep" aria-hidden="true">&middot;</span>
                    <span id="nyc-wind">&mdash;</span>
                </p>
            </article>

            <article class="wx flex-weather bg-ash">
                <p class="wx-place">Ashburn</p>
                <div class="wx-mid">
                    <span class="wx-temp" id="ash-temp">&mdash;</span>
                    <span id="ash-desc"></span>
                </div>
                <p class="wx-meta">
                    <span id="ash-rh">&mdash;</span>
                    <span class="sep" aria-hidden="true">&middot;</span>
                    <span id="ash-wind">&mdash;</span>
                </p>
            </article>

            <article class="wx flex-weather bg-man">
                <p class="wx-place">Manasquan</p>
                <div class="wx-mid">
                    <span class="wx-temp" id="man-temp">&mdash;</span>
                    <span id="man-desc"></span>
                </div>
                <p class="wx-meta">
                    <span id="man-rh">&mdash;</span>
                    <span class="sep" aria-hidden="true">&middot;</span>
                    <span id="man-wind">&mdash;</span>
                </p>
            </article>

        </section>

    </div>

    <script src="/indexjs.js"></script>
</body>

</html>
