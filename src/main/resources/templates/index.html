<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gehan.cloud</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/background.css">
    <link rel="stylesheet" href="/css/apps.css">
    <link rel="stylesheet" href="/css/weather.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

    <div class="bg"></div>
    <div class="bg bg2"></div>
    <div class="bg bg3"></div>
    <div class="content">
        <div class="flex-container">

            <div class="flex-item" onclick="window.location.href='https://photos.gehan.cloud'">
                <i class="bi bi-camera-fill"></i>
            </div>
            <div class="flex-item">
                <i class="bi bi-music-note-beamed"></i>
            </div>
            <div class="flex-item" onclick="window.location.href='https://grocery.gehan.cloud'">
                <i class="bi bi-cup-hot-fill"></i>
            </div>
            <div class="flex-item">
                <i class="bi bi-wifi"></i>
            </div>

        </div>
        <div class="flex-container">
            <div class="flex-item" onclick="window.location.href='/pages/ashburn.html'">
                <i class="bi bi-person-lines-fill"></i>
            </div>
            <div class="flex-item" onclick="window.location.href='https://ha.gehan.cloud'">
                <i class="bi bi-camera-video-fill"></i>
            </div>
            <div class="flex-item">
                <i class="bi bi-house-heart-fill"></i>
            </div>
            <div class="flex-item">
                <i class="bi bi-dash-circle-fill"></i>
            </div>

        </div>
        <div class="flex-container">
            <div class="flex-weather bg-ham">
                <p>Hamilton</p>
                <div class="w-row"><span id="ham-desc" class="w-value w-desc">Loading…</span></div>
                <div class="w-row">
                    <span id="ham-temp" class="w-value w-temp">—</span>
                </div>

                <div class="w-row">
                    <span id="ham-rh" class="w-value">—</span>
                </div>
                <div class="w-row">
                    <i class="bi bi-wind w-ico" aria-hidden="true"></i>
                    <span id="ham-wind" class="w-value">—</span>
                    <span class="sr-only"></span>
                </div>
            </div>

            <div class="flex-weather bg-nyc">
                <p>New York</p>
                <div class="w-row"><span id="nyc-desc" class="w-value w-desc">Loading…</span></div>
                <div class="w-row"><span id="nyc-temp" class="w-value w-temp">—</span></div>

                <div class="w-row">
                    <span id="nyc-rh" class="w-value">—</span>
                </div>
                <div class="w-row">
                    <i class="bi bi-wind w-ico" aria-hidden="true"></i>
                    <span id="nyc-wind" class="w-value">—</span>
                    <span class="sr-only"></span>
                </div>
            </div>
        </div>
        <div class="flex-container">
            <div class="flex-weather bg-ash">
                <p>Ashburn</p>
                <div class="w-row"><span id="ash-desc" class="w-value w-desc">Loading…</span></div>
                <div class="w-row"><span id="ash-temp" class="w-value w-temp">—</span></div>

                <div class="w-row">
                    <span id="ash-rh" class="w-value">—</span>
                </div>
                <div class="w-row">
                    <i class="bi bi-wind w-ico" aria-hidden="true"></i>
                    <span id="ash-wind" class="w-value">—</span>
                    <span class="sr-only"></span>
                </div>
            </div>
            <div class="flex-weather bg-man">
                <p>Manasquan</p>
                <div class="w-row"><span id="man-desc" class="w-value w-desc">Loading…</span></div>
                <div class="w-row"><span id="man-temp" class="w-value w-temp">—</span></div>

                <div class="w-row">
                    <span id="man-rh" class="w-value">—</span>
                </div>
                <div class="w-row">
                    <i class="bi bi-wind w-ico" aria-hidden="true"></i>
                    <span id="man-wind" class="w-value">—</span>
                    <span class="sr-only"></span>
                </div>
            </div>
        </div>
    </div>
    </div>
    </div>

    <script src="/indexjs.js"></script>
</body>

</html>
