# Tests run against in-memory H2 so they never touch the real users.db.
# A test-classpath application.properties replaces the main one entirely, so every
# property the app needs is repeated here.
spring.datasource.url=jdbc:h2:mem:gehan-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false


logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.cloud.gehan=WARN

# The test properties file replaces the main one entirely, so the portal tile
# list has to be imported here as well.
spring.config.import=classpath:apps.yml

# Match production: this registers ForwardedHeaderFilter, which applies X-Forwarded-*
# and then removes those headers. Code that reads them directly behaves differently
# with it on, so the tests need it on too.
server.forward-headers-strategy=framework
