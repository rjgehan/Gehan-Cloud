<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashburn Tools</title>
    <link rel="stylesheet" href="../css/base.css"> 
    <link rel="stylesheet" href="../css/background.css"> 
    <link rel="stylesheet" href="../css/apps.css"> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>
<body>

    <div class="bg"></div>
    <div class="bg bg2"></div>
    <div class="bg bg3"></div>
    <div class="content">
        <div class="flex-container">
            
            <div class="flex-item" onclick="window.location.href='/'">
                <i class="bi bi-house-up-fill"></i>
            </div>
            <div class="flex-item" onclick="window.location.href='https://pad.gehan.cloud'">
                <i class="bi bi-journal-bookmark-fill"></i>
            </div>
            <div class="flex-item" onclick="openLatestShare()">
                <i class="bi bi-box-arrow-in-up-right"></i>
            </div>
            <div class="flex-item" onclick="window.location.href='/pages/ashburnTakeout.html'">
                <i class="bi bi-backpack-fill"></i>
            </div>

        </div>
        <div class="flex-container">
            <div class="flex-item">
                <i class="bi bi-dash-circle-fill"></i>
            </div>
            <div class="flex-item">
                <i class="bi bi-dash-circle-fill"></i>
            </div>
            <div class="flex-item">
                <i class="bi bi-dash-circle-fill"></i>
            </div>
            <div class="flex-item">
                <i class="bi bi-dash-circle-fill"></i>
            </div>

        </div>
    </div>
<script>
async function openLatestShare() {
    try {
        const res = await fetch("/api/share/latest");
        if (!res.ok) {
            alert("No link available yet!");
            return;
        }
        const url = await res.text();
        window.open(url, "_blank");
    } catch (e) {
        console.error("Failed to open latest share:", e);
    }
}
</script>
    <!-- <script src="indexjs.js"></script> -->
</body>
</html>
