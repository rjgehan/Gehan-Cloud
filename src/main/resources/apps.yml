# =============================================================================
# The portal's app tiles. This is the one place to add a service.
#
# The home screen fills a page with as many tiles as fit, then starts another
# page you swipe to, so you never have to think about how many will fit.
# Order here is the order on screen.
#
#   label      text under the icon. One short word reads best.
#   url        absolute for another service, or /path for a page in this app.
#   icon       any Bootstrap Icons name: https://icons.getbootstrap.com
#   color      a palette from home.css: violet amber teal blue red green
#              indigo pink cyan lime orange slate. Omitted means slate.
#   adminOnly  true hides the tile from everyone who is not an admin.
#   lanOnly    true for a service that only routes on the host's own network. The
#              tile is always shown, but off that network it is greyed out and does
#              not link anywhere, instead of hanging in a dead tab. Which networks
#              count is portal.trusted-networks in application.properties.
# =============================================================================
portal:
  apps:

    - label: Photos
      url: https://photos.gehan.cloud
      icon: bi-images
      color: violet

    - label: Grocery
      url: https://grocery.gehan.cloud
      icon: bi-cart-fill
      color: amber

    # Only routes on the home network. beach.gehan.cloud is deliberately absent
    # until its access rules are settled.
    - label: Home
      url: https://home.gehan.cloud/dashboard/
      icon: bi-house-door-fill
      color: teal
      lanOnly: true

    - label: Users
      url: /users
      icon: bi-people-fill
      color: slate
      adminOnly: true

    # A service that only routes on the home network. Off it, this tile greys out.
    # - label: NAS
    #   url: http://192.168.1.50:5000
    #   icon: bi-hdd-network-fill
    #   color: cyan
    #   lanOnly: true
