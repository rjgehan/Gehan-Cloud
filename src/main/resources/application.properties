spring.application.name=gehan-cloud

# --- Portal ------------------------------------------------------------------
# App tiles live in apps.yml so adding a service is a one-entry edit.
spring.config.import=classpath:apps.yml

# --- Storage -----------------------------------------------------------------
# The app writes one file, users.db. Kept under a directory so a container can
# mount a single volume at it. Defaults to the working directory for local runs.
app.data-dir=${APP_DATA_DIR:.}

spring.datasource.url=jdbc:sqlite:${app.data-dir}/users.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Security ----------------------------------------------------------------
# Behind a reverse proxy: honour X-Forwarded-* so redirects keep the public scheme.
server.forward-headers-strategy=framework

# --- Error responses ---------------------------------------------------------
# Never leak stack traces or internal messages to clients.
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# --- Logging -----------------------------------------------------------------
logging.level.root=${LOG_LEVEL:INFO}
logging.level.cloud.gehan=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=INFO
