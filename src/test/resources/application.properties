# Tests run against in-memory H2 so they never touch the real users.db / grocery.json.
# A test-classpath application.properties replaces the main one entirely, so every
# property the app needs is repeated here.
spring.datasource.url=jdbc:h2:mem:gehan-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

grocery.file=target/test-grocery.json
share.key=test-share-key
app.jwt.secret=test-jwt-secret-that-is-long-enough-for-hs256

logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.cloud.gehan=WARN
