name: CodeQL

# Static analysis for the Java in this repo. Runs on the same events as CI, plus a
# weekly scan so newly published query packs find things in code that has not
# changed. Results land in the repository's Security tab.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays, well away from the Sunday Dependabot run.
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # writing the results to the Security tab
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          # security-extended adds the lower-confidence security queries; for an app
          # that takes a password over a form and renders user-supplied names, the
          # extra noise is worth the coverage.
          queries: security-extended

      # Not autobuild: this project's build is one command, and being explicit means
      # a build failure reads as a build failure rather than as autobuild guessing
      # wrong. Tests are skipped because CI already runs them on the same commit.
      - name: Build
        run: ./mvnw -B -DskipTests package

      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
